[project]
name = "teamsmacro"
version = "1.0.0"
description = "Teams Macro — rester en ligne sur Microsoft Teams (Windows)"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "pynput>=1.7.6",
]

[project.scripts]
teams-macro = "teamsmacro.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["teamsmacro*"]
